<section>
  <h2 class="section-title">Добавить обычную заметку</h2>
  <form id="note-form" class="form-grid">
    <input id="note-input" type="text" placeholder="Введите текст заметки" required>
    <button class="btn btn-blue" type="submit">Добавить</button>
  </form>

  <h2 class="section-title">Добавить заметку с напоминанием</h2>
  <form id="reminder-form" class="form-grid-3">
    <input id="reminder-text" type="text" placeholder="Текст напоминания" required>
    <input id="reminder-time" type="datetime-local" required>
    <button class="btn btn-green" type="submit">Добавить</button>
  </form>

  <h2 class="section-title">Список заметок</h2>
  <ul id="notes-list" class="notes-list"></ul>
</section>
